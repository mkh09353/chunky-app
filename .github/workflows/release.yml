name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # These names are consumed directly by Electrobun's codesign/notarytool implementation.
      ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
      ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
      ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
      ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
    steps:
      - uses: actions/checkout@v4

      # package.json resolves @chunky/protocol from ../chunky/packages/protocol.
      - name: Checkout pinned Chunky protocol dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/mkh09353/chunky.git "$GITHUB_WORKSPACE/../chunky"
          git -C "$GITHUB_WORKSPACE/../chunky" checkout --detach 76d4d0e19fd41dd217bf5f851f523d0502db9177

      - uses: oven-sh/setup-bun@v2

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Import Developer ID signing certificate
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/chunky-signing.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/chunky-developer-id.p12
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - run: bun run build

      - name: Create or update GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/chunky-signing.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/chunky-developer-id.p12
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERTIFICATE_PATH"
